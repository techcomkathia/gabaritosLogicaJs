<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f2">
    <title>Prática JS | Laboratório de exercícios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script defer src="js/aulas/aula01.js"></script>
    <script defer src="js/aulas/aula02.js"></script>
    <script defer src="js/aulas/aula03.js"></script>
    <script defer src="js/aulas/aula04.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#aula01" aria-label="Prática JS, início">
            <span class="brand-mark" aria-hidden="true">{ }</span>
            <span>prática<span class="brand-accent">.js</span></span>
        </a>
        <span class="topbar-note">MÓDULO DE LÓGICA · JAVASCRIPT</span>
    </header>
    <div class="workspace">
        <aside class="sidebar" aria-label="Aulas do módulo">
            <p class="sidebar-label">TRILHA DE APRENDIZADO</p>
            <nav id="lesson-nav" class="lesson-nav"></nav>
            <div class="sidebar-note"><span class="note-mark" aria-hidden="true">JS</span><p>Pratique no seu ritmo.<br>Uma questão por vez.</p></div>
        </aside>
        <main class="main-content">
            <section class="lesson-intro" aria-labelledby="lesson-title">
                <p id="lesson-kicker" class="eyebrow"></p>
                <div class="intro-heading"><div><h1 id="lesson-title"></h1><p id="lesson-summary" class="lesson-summary"></p></div><span id="lesson-count" class="lesson-count"></span></div>
            </section>
            <section class="practice" aria-label="Questões da aula">
                <div class="practice-heading"><div><p class="eyebrow">SEU PRÓXIMO PASSO</p><h2>Escolha como praticar</h2></div><span id="question-count" class="question-count" aria-live="polite"></span></div>
                <div class="control-row">
                    <label class="select-control" for="difficulty-select"><span>Dificuldade</span><select id="difficulty-select"><option value="facil">Fácil</option><option value="intermediario">Intermediário</option><option value="avancado">Avançado</option><option value="aleatorio">Aleatório</option></select></label>
                    <label class="pin-control" for="pin-questions"><input id="pin-questions" type="checkbox"><span class="pin-icon" aria-hidden="true">◆</span><span>Fixar estas questões</span></label>
                    <button id="shuffle-button" class="shuffle-button" type="button"><span aria-hidden="true">⤨</span> Sortear questões</button>
                </div>
                <div class="answer-toolbar"><span id="selection-note" class="selection-note" aria-live="polite"></span><button id="toggle-all-answers" class="text-button" type="button">Mostrar todas as respostas</button></div>
                <ol id="question-list" class="question-list"></ol>
            </section>
            <footer class="page-footer"><span>APRENDER É FAZER, TESTAR E TENTAR DE NOVO.</span><span id="footer-lesson"></span></footer>
        </main>
    </div>
</body>
</html>
