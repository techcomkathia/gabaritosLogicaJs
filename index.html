        try {
            document.documentElement.dataset.theme = localStorage.getItem("pratica-js:tema") === "light" ? "light" : "dark";

            document.documentElement.dataset.theme = "dark";

        document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === "dark" ? "#1e1e1e" : "#f8f5fb";

            </button>
        </div>

    <div class="workspace">
        <aside class="sidebar" aria-label="Aulas do módulo">
            <p class="sidebar-label">TRILHA DE APRENDIZADO</p>
            <nav id="lesson-nav" class="lesson-nav"></nav>
            <div class="sidebar-note"><span class="note-mark" aria-hidden="true">JS</span><p>Pratique no seu ritmo.<br>Uma questão por vez.</p></div>
        </aside>
        <main class="main-content">
            <section class="lesson-intro" aria-labelledby="lesson-title">
                <p id="lesson-kicker" class="eyebrow"></p>

            </section>
            <section class="practice" aria-label="Questões da aula">

                <div class="control-row">
                    <label class="select-control" for="difficulty-select"><span>Dificuldade</span><select id="difficulty-select"><option value="facil">Fácil</option><option value="intermediario">Intermediário</option><option value="avancado">Avançado</option><option value="aleatorio">Aleatório</option></select></label>
                    <label class="pin-control" for="pin-questions"><input id="pin-questions" type="checkbox"><span class="pin-icon" aria-hidden="true">◆</span><span>Fixar estas questões</span></label>
                    <button id="shuffle-button" class="shuffle-button" type="button"><span aria-hidden="true">⤨</span> Sortear questões</button>
                </div>
                <div class="answer-toolbar"><span id="selection-note" class="selection-note" aria-live="polite"></span><button id="toggle-all-answers" class="text-button" type="button">Mostrar todas as respostas</button></div>
                <ol id="question-list" class="question-list"></ol>
            </section>

                <div class="footer-author">

            </footer>
        </main>
    </div>
